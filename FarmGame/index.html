<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>もふねこファーム (Pixi MVP)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root { --bg:#F7EEF2; --surface:#fff; --text:#2B2B2B; --primary:#77A1D9; --accent:#F2AEC1; --border:rgba(43,43,43,.12); }
      body { margin:0; font-family:"Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); }
      #app { max-width: 460px; margin: 0 auto; padding: 10px; }
      #hud { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
      #tabs { display:flex; gap:6px; flex-wrap:wrap; }
      button { border-radius:10px; border:1px solid var(--border); background:#fff; padding:6px 10px; }
      button.active, button.primary { background:var(--primary); color:#fff; border-color:transparent; }
      #panel { margin-top:8px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:8px; }
      #canvasWrap { margin-top:8px; border-radius:14px; overflow:hidden; border:1px solid var(--border); }
      .muted { color:#6B6B6B; font-size:12px; }
      .row { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
      #offlineModal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; }
      #offlineModal.show { display:flex; }
      .modal { background:#fff; border-radius:14px; padding:14px; width:min(320px,90vw); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="tabs"></div>
        <div id="stats"></div>
      </div>
      <div id="panel"></div>
      <div id="canvasWrap"></div>
    </div>
    <div id="offlineModal"><div class="modal"><h3>おかえり！</h3><p id="offlineText"></p><button id="offlineOk" class="primary">OK</button></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
